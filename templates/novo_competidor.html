{% extends 'base.html' %}
{% block title %}Novo Competidor — Desafio Fit{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Cadastrar Competidor</h2>
    <form method="POST">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required placeholder="Nome completo" autocomplete="off">
        </div>

        <div class="campo">
            <label>Categoria</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="categoria" value="emagrecimento" required>
                    <span>Emagrecimento</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="categoria" value="hipertrofia">
                    <span>Hipertrofia</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
</div>
{% endblock %}
